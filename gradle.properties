# Gradle 设置
org.gradle.jvmargs=-Xmx2G

# Minecraft 版本
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11

# 模组信息
mod_version=1.0.0
maven_group=com.stellar
archives_base_name=stellar-core

# ========== Loom 下载镜像（强制走 BMCLAPI）==========
# 这些是 Loom 1.5.x 支持的标准属性
fabric.loom.mirror.minecraft=https://bmclapi2.bangbang93.com/
fabric.loom.mirror.maven=https://bmclapi2.bangbang93.com/maven/

# 强制离线模式（不联网验证）
org.gradle.offline=true